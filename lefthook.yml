pre-commit:
  commands:
    duplicates:
      run: pnpm run check:duplicates
    format:
      run: pnpm run format:check
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck

pre-push:
  commands:
    verify:
      run: pnpm run verify

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
