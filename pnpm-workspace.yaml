packages:
  - 'apps/*'
  - 'workers/*'
  - 'packages/*'

# pnpm 10.17+ / 11: settings live here (package.json#pnpm is ignored).
onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - lefthook
  - sharp
  - workerd

overrides:
  # @cloudflare/puppeteer pins a vulnerable @puppeteer/browsers release that
  # pulls extract-zip without a patched release. Keep the runtime API while
  # moving browser archive extraction to modern-tar.
  '@puppeteer/browsers': '3.2.0'
  js-yaml: '>=4.3.1 <5'
  nanoid: '>=3.3.17'
  astro: '>=7.4.7'
  vite: '>=8.3.3 <9'
  devalue: '>=5.9.3'
  lodash: '>=4.18.0'
  hono: '>=4.13.11 <5'
  rollup: '>=4.59.0'
  'fast-uri@<3.1.2': '>=3.1.2'
  fast-uri: '>=4.2.3'
  'fast-xml-parser': '>=5.10.1'
  flatted: '>=3.4.2'
  underscore: '>=1.13.8'
  basic-ftp: '>=6.0.1'
  postcss: '>=8.5.18'
  yaml: '>=2.9.0'
  smol-toml: '>=1.9.0 <2'
  qs: '>=6.17.1'
  minimatch: '>=11.0.5'
  '@typescript-eslint/typescript-estree>minimatch': '>=11.0.5'
  'eslint-plugin-jsx-a11y>minimatch': '>=11.0.5'
  'eslint>ajv': '6.14.0'
  '@stryker-mutator/core>ajv': '>=8.18.0'
  ip-address: '>=10.7.6'
  'mdast-util-to-hast@>=13.0.0 <13.2.1': '>=13.2.1'
  'brace-expansion@<1.1.13': '>=1.1.13'
  'brace-expansion@>=2.0.0 <2.0.3': '>=2.0.3'
  'brace-expansion@>=3.0.0 <5.0.8': '>=5.0.12'
  'brace-expansion@>=4.0.0 <5.0.12': '>=5.0.12'
  '@isaacs/brace-expansion@<=5.0.0': '>=5.0.1'
  'picomatch@<2.3.2': '>=2.3.2'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'minimatch@<3.1.4': '>=3.1.4'
  'minimatch@>=9.0.0 <9.0.7': '>=9.0.7'
  'minimatch@>=10.0.0 <11.0.1': '>=11.0.1'
  ws: '>=8.21.0'
  undici: '>=8.12.4'
  'jsdom>undici': '7.30.1'
  eslint-plugin-astro: '1.7.0'
  astro-eslint-parser: '1.4.0'
  ai: '^6.0.191'
  svgo: '>=4.0.2'
  sharp: '>=0.35.5 <0.36'
  '@hono/node-server': '>=2.1.6'
  '@ai-sdk/provider-utils': '>=4.0.33 <5'
  http-cache-semantics: '>=4.3.0'

  proxy-addr: '>=2.0.8 <3'
  shell-quote: '>=1.11.0 <2'
  source-map-js: '>=1.2.2 <2'
  postcss-selector-parser: '>=7.1.6 <8'
  launch-editor: '>=2.14.2 <3'
  '@modelcontextprotocol/sdk': '>=1.32.0 <2'

  zod: '>=4.6.7'

  happy-dom: '>=21.0.4'

  body-parser: '>=2.4.0'

  vitest: '4.1.12'

  '@vitest/coverage-v8': '4.1.12'

  '@vitest/mocker': '>=4.1.12'

  '@emnapi/runtime': '1.11.3'
  '@napi-rs/wasm-runtime': '1.2.7'
  '@emnapi/core': '1.11.3'
  # Upstream has no fixed release for GHSA-hp3w-g68c-fv3c; use our tested source patch.
  sprintf-js: 'file:./packages/sprintf-safe'

# Transitive advisories with no npm fix yet (pnpm audit --audit-level moderate).
auditConfig:
  ignoreGhsas:
    # GHSA-vfj7-8cjw-p6xm: braces stack-exhaustion DoS; npm latest is still 3.0.3.
    # Dev-only path: astro-eslint-parser>fast-glob>micromatch>braces (eslint tooling).
    # Re-review: 2027-01-04
    - GHSA-vfj7-8cjw-p6xm
