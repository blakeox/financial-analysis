name = "fanalyx-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
AI_GATEWAY_ID = "fanalyx-chat"
R2_SOFT_LIMIT_BYTES = 1073741824     # 1 GiB (dev)
R2_HARD_LIMIT_BYTES = 2147483648     # 2 GiB (dev)
MAX_OBJECT_SIZE_BYTES = 10485760     # 10 MiB
ANALYSIS_CACHE_TTL_SECONDS = 0       # 0 disables Cache API for analysis responses by default
ANALYSIS_MAX_JSON_BYTES = 10485760   # 10 MiB for base64-encoded files
# Comma-separated MIME type prefixes allowed for uploads. Tighten as needed per env.
# Example covers PDFs and modern Office docs (docx/xlsx/pptx via vnd.openxmlformats).
ALLOWED_UPLOAD_MIME_PREFIXES = "application/pdf,application/vnd.openxmlformats"
AI_SEARCH_INSTANCE_NAME = "fanalyx-site"
AI_SEARCH_SOURCE_DOMAIN = "https://fanalyx.com"
BROWSER_RENDERING_ENABLED = "true"
BROWSER_RENDERING_PATH_PREFIXES = "/,/developers,/agent,/docs"

[triggers]
# Reconcile approximate R2 usage hourly to enforce soft-limit lock/unlock.
# Daily log analysis at midnight for security monitoring.
crons = ["0 * * * *", "0 0 * * *"]

# Resource bindings (development/local)
[[d1_databases]]
binding = "DB"
database_name = "financial-analysis-db"
database_id = "d7308084-125e-4675-88ae-bbb096af5167"
preview_database_id = "d7308084-125e-4675-88ae-bbb096af5167"

[[kv_namespaces]]
binding = "SESSIONS"
id = "2b02898694364a2693681466265c912d"
preview_id = "2b02898694364a2693681466265c912d"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "financial-analysis-documents"
preview_bucket_name = "financial-analysis-documents"

[[queues.producers]]
binding = "KNOWLEDGE_JOBS"
queue = "fanalyx-knowledge-jobs"

[[queues.consumers]]
queue = "fanalyx-knowledge-jobs"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"
script_name = "fanalyx-api"

[[durable_objects.bindings]]
name = "FinancialAnalysisAgent"
class_name = "FinancialAnalysisAgent"
script_name = "fanalyx-api"

# Analytics Engine for security event tracking
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Vectorize index for AutoRAG semantic search
[[vectorize]]
binding = "VECTORIZE"
index_name = "financial-analysis-autorag"

[[ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"
remote = true

# Workers AI binding
[ai]
binding = "AI"
gateway = { id = "fanalyx-chat", skip_cache = false, cache_ttl = 3600 }

[browser]
binding = "BROWSER"

# Development configuration
[dev]
port = 8787
local_protocol = "http"
upstream_protocol = "https"
host = "localhost"

# Preview environment
[env.preview]
[env.preview.vars]
ENVIRONMENT = "preview"
R2_SOFT_LIMIT_BYTES = 2147483648     # 2 GiB (preview)
