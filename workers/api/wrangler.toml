# Stripe configuration (secrets - set via: wrangler secret put STRIPE_SECRET_KEY --env production)
# STRIPE_SECRET_KEY = "sk_live_..."
# STRIPE_WEBHOOK_SECRET = "whsec_..."
# Optional: Override default price IDs if needed
# STRIPE_PRICE_PRO = "price_..."
# STRIPE_PRICE_ENTERPRISE = "price_..."
# BASE_URL = "https://fanalyx.com"

# Durable Object migrations (required)
[[migrations]]
tag = "v1"
