name = "fanalyx-web"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# Production API origin
API_ORIGIN = "https://fanalyx-api-production.blakeoxford.workers.dev"

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Custom domain route
[[routes]]
pattern = "fanalyx.com/*"
zone_id = "8b74875a9a9edb1d7572c9d41e9e2016"


# Removed [build] custom command to prevent duplicate astro build runs during dev.

[dev]
port = 8788
local_protocol = "http"
upstream_protocol = "https"
host = "localhost"

# Preview environment
[env.preview]
[env.preview.vars]
ENVIRONMENT = "preview"
API_ORIGIN = "https://financial-analysis-api-preview.blakeoxford.workers.dev"

# Production environment
[env.production]
[env.production.vars]
ENVIRONMENT = "production"
API_ORIGIN = "https://fanalyx-api.blakeoxford.workers.dev"

[[env.production.routes]]
pattern = "fanalyx.com/*"
zone_id = "8b74875a9a9edb1d7572c9d41e9e2016"
