name = "fanalyx-web"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API, MCP, and OAuth routes must reach the Worker before the SPA asset fallback.
run_worker_first = true

# Removed [build] custom command to prevent duplicate astro build runs during dev.

[dev]
port = 8788
local_protocol = "http"
upstream_protocol = "https"
host = "localhost"

# Development environment
[env.development]
name = "fanalyx-web-development"
[env.development.vars]
ENVIRONMENT = "development"
API_DEV_ORIGIN = "http://localhost:8787"

# Preview environment
[env.preview]
name = "fanalyx-web-preview"

[env.preview.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[env.preview.vars]
ENVIRONMENT = "preview"
API_ORIGIN = "https://fanalyx-api-preview.blakeoxford.workers.dev"

# Production environment
[env.production]
name = "fanalyx-web"

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://fanalyx.com"
API_ORIGIN = "https://fanalyx-api-production.blakeoxford.workers.dev"

[[env.production.routes]]
pattern = "fanalyx.com/*"
zone_id = "8b74875a9a9edb1d7572c9d41e9e2016"
