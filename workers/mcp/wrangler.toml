name = "fanalyx-mcp"
main = "src/index.ts"
# Keep this at the newest date supported by the pinned Wrangler/workerd
# toolchain. Raise it only in the same change as a verified Wrangler upgrade.
compatibility_date = "2026-07-02"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

  [observability.logs]
  head_sampling_rate = 1

  [observability.traces]
  enabled = true
  head_sampling_rate = 0.01

# Scaffold (#450 / #438). `/mcp` is available via createMcpHandler but
# productionTraffic remains false — do not attach custom domains or cut over
# live clients from workers/api until an explicit cutover.

[dev]
port = 8791
local_protocol = "http"

[env.development]
name = "fanalyx-mcp-development"
[env.development.vars]
ENVIRONMENT = "development"
WORKER_ROLE = "mcp"
MCP_DEV_AUTH_ENABLED = "true"

[env.preview]
name = "fanalyx-mcp-preview"
[env.preview.vars]
ENVIRONMENT = "preview"
WORKER_ROLE = "mcp"

[env.production]
name = "fanalyx-mcp"
[env.production.vars]
ENVIRONMENT = "production"
WORKER_ROLE = "mcp"
