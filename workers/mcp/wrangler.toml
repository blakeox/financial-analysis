name = "fanalyx-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Scaffold (#450 / #438). `/mcp` is available via createMcpHandler but
# productionTraffic remains false — do not attach custom domains or cut over
# live clients from workers/api until an explicit cutover.

[dev]
port = 8791
local_protocol = "http"

[env.development]
name = "fanalyx-mcp-development"
[env.development.vars]
ENVIRONMENT = "development"
WORKER_ROLE = "mcp"
MCP_DEV_AUTH_ENABLED = "true"

[env.preview]
name = "fanalyx-mcp-preview"
[env.preview.vars]
ENVIRONMENT = "preview"
WORKER_ROLE = "mcp"

[env.production]
name = "fanalyx-mcp"
[env.production.vars]
ENVIRONMENT = "production"
WORKER_ROLE = "mcp"
