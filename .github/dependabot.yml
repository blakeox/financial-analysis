version: 2
updates:
  # Single root entry keeps pnpm-lock.yaml in sync across the monorepo.
  # Path labels (frontend, backend, etc.) come from pr-labeler.yml on each PR.
  - package-ecosystem: 'npm'
    directory: '/'
    versioning-strategy: increase
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    assignees:
      - 'blakeox'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    # Coordinated migrations only — weekly group PRs that include these fail E2E/typecheck
    # (AI Agents stack: #620/#635; TS7/Vitest5: #632). Patch/minor still flow for packages
    # that only list update-types. Lift ignores when the matching migration lands (#580).
    # For 0.y Cloudflare/Agents packages, ignore ALL updates: Dependabot 0.x "majors" still
    # slipped through semver-major ignores and broke Builds/E2E (#635).
    ignore:
      - dependency-name: 'ai'
        update-types: ['version-update:semver-major']
      - dependency-name: 'workers-ai-provider'
        update-types: ['version-update:semver-major']
      - dependency-name: '@cloudflare/workers-types'
        update-types: ['version-update:semver-major']
      - dependency-name: 'agents'
      - dependency-name: '@cloudflare/ai-chat'
      - dependency-name: '@cloudflare/think'
      - dependency-name: '@cloudflare/codemode'
      - dependency-name: '@cloudflare/workers-oauth-provider'
      # Keep MCP SDK locked with agents: solo 1.29→1.30 leaves dual copies and breaks
      # workers/mcp createMcpHandler typing (#646).
      - dependency-name: '@modelcontextprotocol/sdk'
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prettier-plugin-astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro-eslint-parser'
        update-types: ['version-update:semver-major']
    groups:
      cloudflare-ai-runtime:
        # Keep Cloudflare Workers, AI, Agents, and MCP protocol upgrades together.
        # These packages share runtime compatibility contracts and require the
        # dedicated Worker/MCP gates before promotion.
        patterns:
          - '@cloudflare/*'
          - '@modelcontextprotocol/*'
          - 'agents'
          - 'ai'
          - 'workers-ai-provider'
      web-runtime:
        # Frontend framework and browser runtime changes need E2E validation.
        patterns:
          - '@astrojs/*'
          - '@playwright/*'
          - '@tailwindcss/*'
          - 'astro'
          - 'react'
          - 'react-dom'
          - 'tailwindcss'
          - 'lucide-react'
          - 'recharts'
      development-toolchain:
        # Toolchain upgrades are intentionally isolated from runtime upgrades.
        dependency-type: 'development'
        patterns:
          - '@types/*'
          - '@typescript-eslint/*'
          - 'eslint*'
          - 'prettier*'
          - 'typescript'
          - 'vite'
          - 'vitest'
          - 'wrangler'
      test-tooling:
        # Test-only libraries can move together without hiding production
        # runtime changes in the same Dependabot PR.
        dependency-type: 'development'
        patterns:
          - '@axe-core/*'
          - '@testing-library/*'
          - 'happy-dom'
          - 'jest-axe'
          - 'jsdom'
      supporting-runtime:
        # Small, low-coupling runtime libraries remain bounded as a group.
        dependency-type: 'production'
        patterns:
          - 'ajv*'
          - 'jose'
          - 'zod'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    assignees:
      - 'blakeox'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
