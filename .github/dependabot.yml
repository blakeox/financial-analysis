version: 2
updates:
  # Root workspace (shared devDependencies and tooling)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    assignees:
      - 'blakeox'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    assignees:
      - 'blakeox'
    labels:
      - 'dependencies'
      - 'automated'
      - 'frontend'

  - package-ecosystem: 'npm'
    directory: '/workers/api'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    assignees:
      - 'blakeox'
    labels:
      - 'dependencies'
      - 'automated'
      - 'backend'

  - package-ecosystem: 'npm'
    directory: '/packages/analysis'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    assignees:
      - 'blakeox'
    labels:
      - 'dependencies'
      - 'automated'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    assignees:
      - 'blakeox'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
