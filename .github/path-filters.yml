# Shared filters for dorny/paths-filter (ci.yml, pull-request.yml).
# Doc-only paths align with ci.yml push paths-ignore.
code:
  - '**'
  - '!**.md'
  - '!docs/**'
  - '!.github/ISSUE_TEMPLATE/**'
  - '!.github/PULL_REQUEST_TEMPLATE.md'
  - '!.github/chatmodes/**'
  - '!LICENSE'
  - '!CODE_OF_CONDUCT.md'
  - '!SECURITY.md'

web:
  - 'apps/web/**'
  - 'packages/ui/**'
  - 'packages/analysis/**'
  - 'pnpm-lock.yaml'
  - 'package.json'
  - 'pnpm-workspace.yaml'
