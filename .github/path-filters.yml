# Shared path rules for repo-path-filter (ci.yml, pull-request.yml).
# Doc-only paths align with ci.yml push paths-ignore.
code:
  - '**'
  - '!**.md'
  - '!docs/**'
  - '!.github/ISSUE_TEMPLATE/**'
  - '!.github/PULL_REQUEST_TEMPLATE.md'
  - '!.github/chatmodes/**'
  - '!LICENSE'
  - '!CODE_OF_CONDUCT.md'
  - '!SECURITY.md'

web:
  - 'apps/web/**'
  - 'packages/ui/**'
  - 'packages/analysis/**'
  - 'pnpm-lock.yaml'
  - 'package.json'
  - 'pnpm-workspace.yaml'

mcp:
  - 'packages/tools/src/**'
  - 'workers/api/src/index.ts'
  - 'workers/api/src/types.ts'
  - 'workers/api/src/lib/mcp-*.ts'
  - 'workers/api/src/lib/oauth-*.ts'
  - 'workers/api/src/lib/resource-owner-identity.ts'
  - 'workers/api/src/lib/cloudflare-access-identity.ts'
  - 'workers/api/src/__tests__/mcp-*.test.ts'
  - 'workers/api/src/__tests__/oauth-*.test.ts'
  - 'workers/api/src/__tests__/resource-owner-identity.test.ts'
  - 'workers/api/src/__tests__/cloudflare-access-identity.test.ts'
  - 'workers/api/src/__tests__/fixtures/oauth-provider-*'
  - 'workers/api/migrations/0002_*'
  - 'workers/api/migrations/0003_*'
  - 'workers/api/schema.sql'
  - 'workers/api/package.json'
  - 'scripts/cloudflare-oauth-conformance.mjs'
  - 'scripts/link-clerk-user-email.mjs'
  - 'scripts/provision-clerk-oauth.mjs'
  - '.github/workflows/cloudflare-oauth-conformance.yml'
  - '.github/workflows/link-clerk-user-email.yml'
  - '.github/workflows/provision-clerk-oauth.yml'
  - 'pnpm-lock.yaml'
  - 'docs/MCP_CAPABILITY_POLICY.md'
  - 'docs/OAUTH_ROLLOUT.md'
  - '.github/actions/repo-path-filter/action.yml'
  - '.github/path-filters.yml'
  - '.github/workflows/mcp-policy.yml'
