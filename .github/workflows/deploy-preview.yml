name: Deploy Preview (API + Web)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy-preview')
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://fanalyx-api-preview.blakeoxford.workers.dev
    env:
      # Inject commit SHA for /version endpoint
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is required" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is required" >&2; exit 1; }

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build Astro site
        working-directory: apps/web
        run: pnpm build

      - name: Deploy API (preview)
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=preview --var COMMIT_SHA:${COMMIT_SHA}

      - name: Deploy Web (preview)
        working-directory: workers/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=preview --var COMMIT_SHA:${COMMIT_SHA}
