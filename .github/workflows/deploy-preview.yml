name: Deploy Preview (API + Web)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy-preview')
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://financial-analysis-api-preview.blakeoxford.workers.dev
    env:
      # Inject commit SHA for /version endpoint
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build Astro site
        working-directory: apps/web
        run: pnpm build

      - name: Deploy API (preview)
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=preview --var COMMIT_SHA:${COMMIT_SHA}

      - name: Deploy Web (preview)
        working-directory: workers/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=preview --var COMMIT_SHA:${COMMIT_SHA}
