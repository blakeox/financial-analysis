name: Deploy Preview (API + Web)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy-preview')
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://fanalyx-api-preview.blakeoxford.workers.dev
    env:
      # Inject commit SHA for /version endpoint
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_PREVIEW_API_TOKEN is required" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is required" >&2; exit 1; }

      - name: Verify Cloudflare token is active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token_status=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")
          jq -e '.success == true and .result.status == "active"' <<<"${token_status}" >/dev/null || {
            echo 'CLOUDFLARE_PREVIEW_API_TOKEN is not active.' >&2
            exit 1
          }

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Verify Cloudflare target D1
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler d1 migrations list DB --config wrangler.toml --env=preview --remote

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build Astro site
        working-directory: apps/web
        run: pnpm build

      - name: Apply API D1 migrations (preview)
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler d1 migrations apply DB --config wrangler.toml --env=preview --remote

      - name: Deploy API (preview)
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=preview --var COMMIT_SHA:"${COMMIT_SHA}"

      - name: Deploy Web (preview)
        working-directory: workers/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=preview --var COMMIT_SHA:"${COMMIT_SHA}"

      - name: Smoke-test preview deployment receipt
        env:
          API_URL: https://fanalyx-api-preview.blakeoxford.workers.dev
          ENVIRONMENT: preview
          EXPECTED_SHA: ${{ env.COMMIT_SHA }}
          EXPECTED_OAUTH_ENABLED: 'true'
          EXPECTED_BUDGET_ENFORCEMENT_ENABLED: 'true'
          CLOUDFLARE_BOUNDARY_RECEIPT: boundary-receipt-preview.json
          WEB_URL: https://fanalyx-web-preview.blakeoxford.workers.dev
        run: |
          set -euo pipefail
          node scripts/cloudflare-boundary-smoke.mjs

          web_html="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            "${WEB_URL}/")"
          grep -Fq '<title>Fanalyx | AI-Powered Financial Analysis</title>' <<<"${web_html}"

          echo "Preview API and web receipts verified for ${EXPECTED_SHA}"

      - name: Run preview OAuth conformance
        env:
          API_URL: https://fanalyx-api-preview.blakeoxford.workers.dev
          ENVIRONMENT: preview
          EXPECT_OAUTH_ENABLED: 'true'
          OIDC_TEST_CLIENT_ID: ESxeGH9aCGLP1EYJ
          OIDC_TEST_REDIRECT_URI: https://fanalyx-api-preview.blakeoxford.workers.dev/oauth/callback
          CLOUDFLARE_OAUTH_RECEIPT: cloudflare-oauth-conformance-preview.json
        run: node scripts/cloudflare-oauth-conformance.mjs

      - name: Upload preview boundary receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-boundary-preview
          path: boundary-receipt-preview.json
          if-no-files-found: ignore

      - name: Upload preview OAuth receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-oauth-conformance-preview
          path: cloudflare-oauth-conformance-preview.json
          if-no-files-found: ignore

      - name: Record preview deployment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const body = [
              '### Cloudflare preview deployment verified',
              '',
              `- API: https://fanalyx-api-preview.blakeoxford.workers.dev`,
              '- Web: https://fanalyx-web-preview.blakeoxford.workers.dev',
              `- Commit: \`${context.sha}\``,
              '- Receipt: API `/health` and `/version` plus the web title matched the preview deployment contract.',
              '- Preview OAuth and the D1 budget reservation canary are enabled; production remains separately gated.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
