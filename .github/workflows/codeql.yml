name: CodeQL

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      (github.actor == 'blakeox' || github.actor == 'github-actions[bot]')
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Resolve NUC execution policy
        id: policy
        uses: ./.github/actions/nuc-policy

      - name: Report NUC policy (no checkout)
        if: steps.policy.outputs.run != 'true'
        run: echo "${{ steps.policy.outputs.policy_message }}"

      - name: Checkout
        if: steps.policy.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Detect skip-ci label
        if: steps.policy.outputs.run == 'true' && github.event_name == 'pull_request'
        id: skip
        uses: ./.github/actions/pr-skip-ci
        with:
          pr_labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      - name: Detect path changes
        if: steps.policy.outputs.run == 'true' && github.event_name == 'pull_request'
        id: paths
        uses: ./.github/actions/repo-path-filter
        with:
          filters-file: .github/path-filters.yml

      - name: Skipped (doc-only or skip-ci)
        if: |
          steps.policy.outputs.run == 'true' &&
          github.event_name == 'pull_request' && (
            steps.skip.outputs.skip_ci == 'true' ||
            steps.paths.outputs.code != 'true'
          )
        run: echo "CodeQL skipped — doc-only PR or skip-ci label."

      - name: Ensure Node.js
        if: |
          steps.policy.outputs.run == 'true' && (
            github.event_name != 'pull_request' || (
              steps.skip.outputs.skip_ci != 'true' &&
              steps.paths.outputs.code == 'true'
            )
          )
        uses: ./.github/actions/ensure-node

      - name: Initialize CodeQL
        if: |
          steps.policy.outputs.run == 'true' && (
            github.event_name != 'pull_request' || (
              steps.skip.outputs.skip_ci != 'true' &&
              steps.paths.outputs.code == 'true'
            )
          )
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        if: |
          steps.policy.outputs.run == 'true' && (
            github.event_name != 'pull_request' || (
              steps.skip.outputs.skip_ci != 'true' &&
              steps.paths.outputs.code == 'true'
            )
          )
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
