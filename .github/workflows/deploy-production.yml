name: Deploy Production (API + Web)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm this is an intentional production redeploy from main
        required: true
        type: boolean
      commit_sha:
        description: Optional known-good main SHA for a controlled rollback; blank deploys current main
        required: false
        type: string
      preview_run_id:
        description: Successful Deploy Preview workflow run whose SHA matches the deployment SHA
        required: true
        type: string
      rollback_sha:
        description: Known-good main commit to use as the documented rollback reference
        required: true
        type: string
      approval_reference:
        description: Change record, issue, or operator approval reference for this promotion
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://fanalyx.com
    env:
      COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Verify deployment SHA is a main commit
        run: |
          set -euo pipefail
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a 40-character lowercase commit SHA" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA}"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${COMMIT_SHA}" FETCH_HEAD

      - name: Verify successful preview receipt
        id: preview_receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          set -euo pipefail
          [[ "${PREVIEW_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo "preview_run_id must be numeric" >&2
            exit 1
          }
          preview_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIEW_RUN_ID}")"
          jq -e --arg sha "${COMMIT_SHA}" \
            '.name == "Deploy Preview (API + Web)" and
             .status == "completed" and
             .conclusion == "success" and
             .head_sha == $sha' <<<"${preview_run}" >/dev/null
          echo "url=$(jq -er '.html_url' <<<"${preview_run}")" >> "${GITHUB_OUTPUT}"

      - name: Verify rollback reference
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -euo pipefail
          [[ "${ROLLBACK_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "rollback_sha must be a 40-character lowercase commit SHA" >&2
            exit 1
          }
          git cat-file -e "${ROLLBACK_SHA}^{commit}"
          git merge-base --is-ancestor "${ROLLBACK_SHA}" origin/main

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is required" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is required" >&2; exit 1; }

      - name: Verify Cloudflare token is active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token_status=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")
          jq -e '.success == true and .result.status == "active"' <<<"${token_status}" >/dev/null || {
            echo 'CLOUDFLARE_API_TOKEN is not active.' >&2
            exit 1
          }

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Verify Cloudflare target D1
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler d1 migrations list DB --config wrangler.toml --env=production --remote

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build Astro site
        working-directory: apps/web
        run: pnpm build

      - name: Apply API D1 migrations (production)
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler d1 migrations apply DB --config wrangler.toml --env=production --remote

      - name: Deploy API (production)
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=production --var COMMIT_SHA:"${COMMIT_SHA}"

      - name: Deploy Web (production)
        working-directory: workers/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=production --var COMMIT_SHA:"${COMMIT_SHA}"

      - name: Smoke-test production deployment
        id: production_smoke
        env:
          API_URL: https://api.fanalyx.com
          ENVIRONMENT: production
          PUBLIC_URL: https://fanalyx.com
          CLOUDFLARE_BOUNDARY_RECEIPT: boundary-receipt-production.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ env.COMMIT_SHA }}
        run: |
          set -euo pipefail

          smoke_attempt=1
          smoke_max_attempts=6
          until node scripts/cloudflare-boundary-smoke.mjs; do
            if (( smoke_attempt >= smoke_max_attempts )); then
              echo "Production boundary smoke did not become ready after ${smoke_max_attempts} attempts." >&2
              exit 1
            fi
            echo "Production boundary smoke is not ready yet; retrying in 15 seconds (attempt ${smoke_attempt}/${smoke_max_attempts})." >&2
            sleep 15
            smoke_attempt=$((smoke_attempt + 1))
          done

          fetch_json() {
            curl \
              --fail \
              --silent \
              --show-error \
              --header 'Accept: application/json' \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time 30 \
              "$1"
          }

          api_health="$(fetch_json "${API_URL}/health")"
          jq -e \
            '.status == "ok" and .environment == "production"' <<<"${api_health}" >/dev/null

          api_version="$(fetch_json "${API_URL}/version")"
          jq -e --arg sha "${EXPECTED_SHA}" \
            '.environment == "production" and .commit == $sha' <<<"${api_version}" >/dev/null

          openapi="$(fetch_json "${API_URL}/openapi.json")"
          jq -e '.openapi | strings | length > 0' <<<"${openapi}" >/dev/null

          web_deployments="$(pnpm dlx wrangler deployments list --env=production --name=fanalyx-web --json)"
          web_version_id="$(jq -er \
            'sort_by(.created_on) | last | .versions | map(select(.percentage == 100)) | if length == 1 then .[0].version_id else error("expected one active production web version") end' \
            <<<"${web_deployments}")"
          web_version="$(pnpm dlx wrangler versions view "${web_version_id}" --env=production --name=fanalyx-web --json)"
          jq -e --arg sha "${EXPECTED_SHA}" \
            '(.resources.bindings | map(select(.name == "ENVIRONMENT" and .text == "production")) | length == 1) and
             (.resources.bindings | map(select(.name == "COMMIT_SHA" and .text == $sha)) | length == 1)' \
            <<<"${web_version}" >/dev/null

          echo "Production smoke checks passed for ${EXPECTED_SHA}"

      - name: Write production promotion receipt
        if: always()
        env:
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          PREVIEW_RUN_URL: ${{ steps.preview_receipt.outputs.url }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
        run: |
          set -euo pipefail
          jq -n \
            --arg commitSha "${COMMIT_SHA}" \
            --arg previewRunId "${PREVIEW_RUN_ID}" \
            --arg previewRunUrl "${PREVIEW_RUN_URL}" \
            --arg rollbackSha "${ROLLBACK_SHA}" \
            --arg approvalReference "${APPROVAL_REFERENCE}" \
            --arg actor "${ACTOR}" \
            --arg workflowRunId "${WORKFLOW_RUN_ID}" \
            --arg smokeOutcome "${SMOKE_OUTCOME}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            '{
              schemaVersion: "1.0.0",
              kind: "cloudflare-production-promotion",
              environment: "production",
              commitSha: $commitSha,
              previewRunId: $previewRunId,
              previewRunUrl: $previewRunUrl,
              rollbackSha: $rollbackSha,
              approvalReference: $approvalReference,
              actor: $actor,
              workflowRunId: $workflowRunId,
              smokeOutcome: $smokeOutcome,
              generatedAt: $generatedAt
            }' > promotion-receipt-production.json

      - name: Upload production boundary receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-boundary-production
          path: boundary-receipt-production.json
          if-no-files-found: ignore

      - name: Upload production promotion receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-promotion-production
          path: promotion-receipt-production.json
          if-no-files-found: error
