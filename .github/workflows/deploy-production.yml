name: Deploy Production (API + Web)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fanalyx.com
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package (for Astro build)
        run: pnpm --filter @financial-analysis/ui run build

      - name: Build Astro site
        working-directory: apps/web
        run: pnpm build

      - name: Deploy API (production)
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=production --var COMMIT_SHA:${COMMIT_SHA}

      - name: Deploy Web (production)
        working-directory: workers/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        run: |
          pnpm dlx wrangler deploy --env=production --var COMMIT_SHA:${COMMIT_SHA}
