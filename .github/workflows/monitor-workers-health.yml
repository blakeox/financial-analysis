name: Monitor Workers Health (prod)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-workers-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Scripts to check (by Worker scriptName)
      SCRIPTS: '["financial-analysis-api","financial-analysis-web"]'
      # Fail threshold in percent (float)
      ERROR_RATE_THRESHOLD: '1.0'
    steps:
      - name: Precheck required secrets
        id: precheck
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "Missing Cloudflare secrets; skipping run" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure jq is installed
        if: steps.precheck.outputs.skip != 'true'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi
      - name: Query Workers errors via GraphQL
        id: gq
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          from=$(date -u -v-30M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          scripts=$(echo "$SCRIPTS" | jq -r '.[]')
          any_fail=0
          summary_lines=()
          for script in $scripts; do
            payload=$(jq -n \
              --arg acct "$ACCOUNT_ID" \
              --arg script "$script" \
              --arg from "$from" \
              --arg to "$now" \
              '{
                query: "query($accountTag: String!, $script: String!, $from: Time!, $to: Time!){ viewer { accounts(filter:{accountTag:$accountTag}) { workersInvocationsAdaptive(limit: 1000, filter:{ scriptName: $script, datetime_geq: $from, datetime_leq: $to }) { sum { invocations errors } } } } }",
                variables: { accountTag: $acct, script: $script, from: $from, to: $to }
              }')
            resp=$(curl -sS -X POST \
              -H "Authorization: Bearer $API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              https://api.cloudflare.com/client/v4/graphql)
            inv=$(echo "$resp" | jq '[.data.viewer.accounts[].workersInvocationsAdaptive[].sum.invocations] | add // 0')
            err=$(echo "$resp" | jq '[.data.viewer.accounts[].workersInvocationsAdaptive[].sum.errors] | add // 0')
            rate=$(awk -v e="$err" -v i="$inv" 'BEGIN { if (i==0) {print 0} else {print (e*100.0)/i} }')
            summary_lines+=("$script invocations=$inv errors=$err errorRatePct=$rate from=$from to=$now")
            exceed=$(awk -v r="$rate" -v t="$ERROR_RATE_THRESHOLD" 'BEGIN { if (r>t) print 1; else print 0 }')
            if [ "$exceed" -eq 1 ]; then
              any_fail=1
            fi
          done
          printf '%s\n' "${summary_lines[@]}" > summary.txt
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          cat summary.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ "$any_fail" -eq 1 ]; then
            echo "Workers error rate exceeded threshold" >&2
            exit 1
          fi

      - name: Notify Slack (optional)
        if: failure() && steps.precheck.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            msg=$(printf 'Workers health alert (error rate > %s%%)\n%s' "$ERROR_RATE_THRESHOLD" "${{ steps.gq.outputs.summary }}")
            curl -X POST -H 'Content-type: application/json' --data "{\"text\": \"$msg\"}" "$SLACK_WEBHOOK_URL"
          else
            echo "No SLACK_WEBHOOK_URL configured; skipping notification"
          fi

      - name: Create or update GitHub Issue
        if: failure() && steps.precheck.outputs.skip != 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'alert:workers-errors';
            const title = `Workers health alert: error rate > ${{ env.ERROR_RATE_THRESHOLD }}%`;
            const body = `Automated alert from Monitor Workers Health workflow.\n\n${{ steps.gq.outputs.summary }}`;
            // Ensure label exists
            try { await github.rest.issues.getLabel({ owner, repo, name: label }); } catch {
              try { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'D93F0B', description: 'Cloudflare Workers error rate alerts' }); } catch {}
            }
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            const existing = issues.find(i => i.title.startsWith('Workers health alert'));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              core.info(`Created issue #${created.data.number}`);
            }
