name: Dependabot auto-merge

# Queues squash auto-merge for Dependabot patch/minor PRs when CI succeeds.
# No checkout on the NUC — GraphQL/API only. Dependabot never runs on the NUC.
# Requires: Settings → General → Allow auto-merge.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  dependabot-automerge:
    name: Auto-merge Dependabot (patch/minor)
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: [self-hosted, nuc, financial-analysis]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (patch/minor)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.user.login !== 'dependabot[bot]' || pr.state !== 'open') {
              core.info(`Skipping (author=${pr.user.login}, state=${pr.state}).`);
              return;
            }

            const title = pr.title;
            const match = title.match(
              /from (\d+)\.(\d+)\.\d+ to (\d+)\.(\d+)\.\d+/,
            );
            if (!match) {
              core.warning(`Could not parse version from title: ${title}`);
              return;
            }

            const oldMajor = Number(match[1]);
            const oldMinor = Number(match[2]);
            const newMajor = Number(match[3]);
            const newMinor = Number(match[4]);

            let updateType = 'patch';
            if (newMajor > oldMajor) updateType = 'major';
            else if (newMinor > oldMinor) updateType = 'minor';

            if (updateType === 'major') {
              core.info('Skipping auto-merge for major version bump — review manually.');
              return;
            }

            await github.graphql(
              `mutation ($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }) {
                  pullRequest { autoMergeRequest { enabledAt } }
                }
              }`,
              {
                pullRequestId: pr.node_id,
                mergeMethod: 'SQUASH',
              },
            );
            core.info(`Queued squash auto-merge for Dependabot PR #${prNumber} (${updateType}).`);
