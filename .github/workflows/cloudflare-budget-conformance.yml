name: Cloudflare Budget Conformance

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuc-scheduled-monitors
  cancel-in-progress: false

jobs:
  preview:
    name: Preview D1 budget reservation
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 10
    environment: preview
    env:
      API_URL: https://fanalyx-api-preview.blakeoxford.workers.dev
      ENVIRONMENT: preview
      EXPECTED_BUDGET_ENFORCEMENT_ENABLED: 'true'
      EXPECTED_SHA: ''
      BUDGET_CONFORMANCE_TOKEN: ${{ secrets.BUDGET_CONFORMANCE_TOKEN }}
      CLOUDFLARE_BUDGET_RECEIPT: cloudflare-budget-conformance-preview.json
    steps:
      - name: Checkout conformance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Ensure Node.js
        uses: ./.github/actions/ensure-node

      - name: Run hosted budget conformance
        run: node scripts/cloudflare-budget-conformance.mjs

      - name: Upload budget receipt
        if: ${{ always() && hashFiles('cloudflare-budget-conformance-preview.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cloudflare-budget-conformance-preview
          path: cloudflare-budget-conformance-preview.json
          if-no-files-found: error
