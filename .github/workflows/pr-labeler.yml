name: PR labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, nuc, financial-analysis]
    steps:
      - name: Resolve NUC execution policy
        id: policy
        uses: ./.github/actions/nuc-policy

      - name: Report NUC policy (no checkout)
        if: steps.policy.outputs.run != 'true'
        run: echo "${{ steps.policy.outputs.policy_message }}"

      - name: Checkout
        if: steps.policy.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Apply path-based labels
        if: steps.policy.outputs.run == 'true'
        uses: ./.github/actions/pr-path-labeler
