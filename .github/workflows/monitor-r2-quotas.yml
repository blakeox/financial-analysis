name: Monitor R2 Quotas (prod)

on:
  schedule:
    # Daily R2 quota check (09:30 UTC)
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-r2-quotas
  cancel-in-progress: true

jobs:
  check:
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Precheck production API URL
        id: precheck
        env:
          API_URL: ${{ vars.PROD_API_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          SMOKE_PROBE_TOKEN: ${{ secrets.FANALYX_SMOKE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ] || [ -z "${SMOKE_PROBE_TOKEN:-}" ]; then
            {
              echo "skip=false"
              echo "failure_stage=precheck"
              echo "failure_reason=PROD_API_URL, ADMIN_API_TOKEN, and FANALYX_SMOKE_TOKEN are required"
            } >> "$GITHUB_OUTPUT"
            echo "PROD_API_URL, ADMIN_API_TOKEN, and FANALYX_SMOKE_TOKEN are required; quota cannot be verified" >&2
            exit 1
          fi
          probe() {
            local label="$1"
            local header="$2"
            local response_file
            local headers_file
            local code
            response_file=$(mktemp)
            headers_file=$(mktemp)
            code=$(curl -sS -D "$headers_file" -o "$response_file" -w "%{http_code}" \
              -H "x-fanalyx-smoke-token: $SMOKE_PROBE_TOKEN" \
              -H "$header" \
              "$API_URL/v1/storage/status" || true)
            echo "${label} status=${code}" >&2
            echo "${label} body=$(tr '\r\n' '  ' < "$response_file" | cut -c1-512)" >&2
            echo "${label} headers=$(grep -iE '^(cf-ray|content-type|cache-control|vary|x-error-code|x-request-id|server):' "$headers_file" | tr '\r\n' '  ' | cut -c1-512 || true)" >&2
            rm -f "$response_file" "$headers_file"
            printf '%s' "$code"
          }
          dedicated_code=$(probe dedicated "x-admin-api-token: $ADMIN_API_TOKEN")
          bearer_code=$(probe bearer "Authorization: Bearer $ADMIN_API_TOKEN")
          code="$dedicated_code"
          if [ "$code" != "200" ]; then
            {
              echo "skip=false"
              echo "failure_stage=precheck"
              echo "failure_reason=storage status endpoint returned HTTP $code"
            } >> "$GITHUB_OUTPUT"
            echo "Endpoint not healthy or authorized (dedicated_status=$dedicated_code bearer_status=$bearer_code)" >&2
            exit 1
          else
            {
              echo "skip=false"
              echo "failure_stage="
              echo "failure_reason="
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure jq is installed
        if: steps.precheck.outputs.skip != 'true'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq
          fi
      - name: Check storage status
        id: status
        env:
          API_URL: ${{ vars.PROD_API_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          SMOKE_PROBE_TOKEN: ${{ secrets.FANALYX_SMOKE_TOKEN }}
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          failure_stage=storage-status
          failure_reason="storage status check failed before a valid measurement was produced"
          on_error() {
            status=$?
            {
              echo "failure_stage=$failure_stage"
              echo "failure_reason=$failure_reason (exit=$status)"
            } >> "$GITHUB_OUTPUT"
          }
          trap on_error ERR
          API="$API_URL"
          resp=$(curl -sS -f \
            -H "x-fanalyx-smoke-token: $SMOKE_PROBE_TOKEN" \
            -H "x-admin-api-token: $ADMIN_API_TOKEN" \
            "$API/v1/storage/status")
          echo "Response: $resp"
          if ! echo "$resp" | jq -e '(.locked | type == "boolean") and (.approxBytes | type == "number") and (.softLimit | type == "number")' >/dev/null; then
            failure_reason="storage status response did not match the expected quota contract"
            exit 1
          fi
          locked=$(echo "$resp" | jq -r '.locked')
          approx=$(echo "$resp" | jq -r '.approxBytes')
          soft=$(echo "$resp" | jq -r '.softLimit')
          # 80% threshold using integer arithmetic
          thresh=$(( soft * 80 / 100 ))
          {
            echo "api=$API"
            echo "locked=$locked"
            echo "approx=$approx"
            echo "soft=$soft"
            echo "thresh=$thresh"
          } >> "$GITHUB_OUTPUT"
          if [ "$locked" = "true" ]; then
            failure_stage=quota-threshold
            failure_reason="R2 uploads are locked due to quota"
            echo "R2 uploads locked due to quota"
            exit 1
          fi
          if [ "$approx" -ge "$thresh" ]; then
            failure_stage=quota-threshold
            failure_reason="R2 usage is at or above 80% of the soft limit"
            echo "R2 usage approaching soft limit (>=80%)"
            exit 1
          fi
          {
            echo "failure_stage="
            echo "failure_reason="
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Notify (optional Slack)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            msg="R2 quota monitor result. stage=${{ steps.status.outputs.failure_stage || steps.precheck.outputs.failure_stage || 'unknown' }}, reason=${{ steps.status.outputs.failure_reason || steps.precheck.outputs.failure_reason || 'no diagnostic was recorded' }}, locked=${{ steps.status.outputs.locked || 'unknown' }}, approx=${{ steps.status.outputs.approx || 'unknown' }}, soft=${{ steps.status.outputs.soft || 'unknown' }}, thresh=${{ steps.status.outputs.thresh || 'unknown' }}"
            payload=$(jq -n --arg text "$msg" '{text: $text}')
            curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
          else
            echo "No SLACK_WEBHOOK_URL configured; skipping notification"
          fi

      - name: Create or update GitHub Issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ALERT_STAGE: "${{ steps.status.outputs.failure_stage || steps.precheck.outputs.failure_stage || 'unknown' }}"
          ALERT_REASON: "${{ steps.status.outputs.failure_reason || steps.precheck.outputs.failure_reason || 'no diagnostic was recorded' }}"
          ALERT_LOCKED: "${{ steps.status.outputs.locked || 'unknown' }}"
          ALERT_APPROX: "${{ steps.status.outputs.approx || 'unknown' }}"
          ALERT_SOFT: "${{ steps.status.outputs.soft || 'unknown' }}"
          ALERT_THRESH: "${{ steps.status.outputs.thresh || 'unknown' }}"
          ALERT_API: "${{ steps.status.outputs.api || vars.PROD_API_URL || 'unknown' }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { ALERT_STAGE: stage, ALERT_REASON: reason, ALERT_LOCKED: locked, ALERT_APPROX: approx, ALERT_SOFT: soft, ALERT_THRESH: thresh, ALERT_API: api } = process.env;
            const isThresholdAlert = stage === 'quota-threshold';
            const title = isThresholdAlert
              ? `R2 quota alert: ${locked === 'true' ? 'LOCKED' : 'HIGH USAGE'}`
              : `R2 quota monitor failure: ${stage}`;
            const body = [
              `Automated alert from Monitor R2 Quotas workflow.`,
              '',
              `- Result: ${isThresholdAlert ? 'valid quota measurement exceeded a threshold' : 'quota status could not be verified'}`,
              `- Failure stage: ${stage}`,
              `- Failure reason: ${reason}`,
              `- API: ${api}`,
              `- locked: ${locked}`,
              `- approxBytes: ${approx}`,
              `- softLimit: ${soft}`,
              `- 80% threshold: ${thresh}`,
              `- Timestamp: ${new Date().toISOString()}`,
              '',
              `This issue is created automatically when R2 usage is locked or ≥80% of the soft limit. It will be reused for subsequent alerts.`,
            ].join('\n');

            // Try to find an existing open issue with our label and similar title
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'alert:R2-quota';
            // Ensure label exists (ignore errors if already exists)
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              try { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'B60205', description: 'R2 quota monitoring alerts' }); } catch {}
            }

            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            const existing = issues.find(i => i.title.startsWith('R2 quota alert') || i.title.startsWith('R2 quota monitor failure'));

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              core.info(`Created issue #${created.data.number}`);
            }
