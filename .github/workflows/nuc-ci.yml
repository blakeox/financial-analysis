name: NUC CI

# The NUC is a controlled Linux certification lane, not the default executor
# for arbitrary pull-request code. Hosted checks remain the portable baseline.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate on the controlled NUC
        required: true
        default: main
        type: string
      mode:
        description: NUC validation depth
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - verify

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: nuc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NUC_NODE_BIN: /home/github-runner/.local/node-v24.18.0/bin

jobs:
  nuc-heartbeat:
    name: NUC / availability heartbeat
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_JOB: NUC / runner smoke
    steps:
      - name: Verify NUC job availability and completion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 900 ))
          jobs_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"

          while (( $(date +%s) < deadline )); do
            response="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$jobs_url")"
            job="$(echo "$response" | jq -c --arg expected "$EXPECTED_JOB" \
              '[.jobs[] | select(.name == $expected)] | first // empty')"

            if [[ -z "$job" ]]; then
              echo "waiting for $EXPECTED_JOB to appear in run $GITHUB_RUN_ID"
              sleep 15
              continue
            fi

            status="$(echo "$job" | jq -r '.status')"
            conclusion="$(echo "$job" | jq -r '.conclusion // ""')"
            runner="$(echo "$job" | jq -r '.runner_name // "pending"')"
            printf 'nuc_job_status=%s conclusion=%s runner=%s\n' "$status" "$conclusion" "$runner"

            if [[ "$status" == "completed" ]]; then
              test "$conclusion" = "success" || {
                echo "NUC job failed; inspect $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >&2
                exit 1
              }
              test "$runner" = "automation-nuc-financial-analysis"
              exit 0
            fi

            sleep 15
          done

          echo "timed out waiting for $EXPECTED_JOB; the NUC may be offline or unavailable" >&2
          exit 1

  runner-smoke:
    name: NUC / runner smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, nuc, financial-analysis]
    timeout-minutes: 15
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Report runner identity
        run: |
          set -euo pipefail
          export PATH="$NUC_NODE_BIN:$PATH"
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'host=%s\n' "$(hostname)"
          printf 'platform=%s\n' "$(uname -a)"
          printf 'node=%s\n' "$(node --version)"
          printf 'pnpm=%s\n' "$(pnpm --version)"
          df -h /
          test "${RUNNER_NAME:-}" = "automation-nuc-financial-analysis"

      - name: Verify repository checkout
        run: |
          set -euo pipefail
          test -f package.json
          test -f pnpm-lock.yaml
          git status --short

      - name: Run bounded verification
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        run: |
          set -euo pipefail
          export PATH="$NUC_NODE_BIN:$PATH"
          pnpm install --frozen-lockfile
          pnpm run test:ci

  promotion-certification:
    name: NUC / certified
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feature/promote-nuc-')
    runs-on: [self-hosted, linux, x64, nuc, financial-analysis]
    timeout-minutes: 45
    environment:
      name: nuc-certification
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Assert trusted promotion boundary
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
          case "$HEAD_REF" in
            feature/promote-nuc-*) ;;
            *) echo "unexpected promotion branch: $HEAD_REF" >&2; exit 1 ;;
          esac

      - name: Checkout promotion candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Report NUC identity and capacity
        run: |
          set -euo pipefail
          export PATH="$NUC_NODE_BIN:$PATH"
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'host=%s\n' "$(hostname)"
          printf 'node=%s\n' "$(node --version)"
          printf 'pnpm=%s\n' "$(pnpm --version)"
          df -h /
          test "${RUNNER_NAME:-}" = "automation-nuc-financial-analysis"

      - name: Install exact candidate dependencies
        working-directory: source
        run: |
          set -euo pipefail
          export PATH="$NUC_NODE_BIN:$PATH"
          pnpm install --frozen-lockfile

      - name: Run authoritative candidate verification
        working-directory: source
        run: |
          set -euo pipefail
          export PATH="$NUC_NODE_BIN:$PATH"
          pnpm run test:ci
