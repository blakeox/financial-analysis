name: NUC CI

# Weekly/manual smoke on the Dell self-hosted runner. Promotion certification uses
# pull_request_target with maintainer environment approval (same-repo only).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate on the controlled Dell runner
        required: true
        default: main
        type: string
      mode:
        description: Dell validation depth
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - verify

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: nuc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: NUC / runner smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, dell, financial-analysis]
    timeout-minutes: 15
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Materialize full working tree (persistent runner workspace)
        shell: bash
        run: |
          git sparse-checkout disable 2>/dev/null || true
          git checkout-index -a -f
          git config --local --unset-all extensions.partialClone 2>/dev/null || true
          git config --local --unset-all remote.origin.promisor 2>/dev/null || true
          git config --local --unset-all remote.origin.partialclonefilter 2>/dev/null || true
          test -f .github/actions/setup-monorepo/action.yml

      - name: Report runner identity
        run: |
          set -euo pipefail
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'host=%s\n' "$(hostname)"
          printf 'platform=%s\n' "$(uname -a)"
          df -h /
          test "${RUNNER_NAME:-}" = "automation-dell-financial-analysis"

      - name: Verify repository checkout
        run: |
          set -euo pipefail
          test -f package.json
          test -f pnpm-lock.yaml
          git status --short

      - name: Setup monorepo
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        uses: ./.github/actions/setup-monorepo

      - name: Run bounded verification
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m pnpm run test:ci

  promotion-certification:
    name: NUC / certified
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feature/promote-nuc-')
    runs-on: [self-hosted, dell, financial-analysis]
    timeout-minutes: 45
    environment:
      name: nuc-certification
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Assert trusted promotion boundary
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
          case "$HEAD_REF" in
            feature/promote-nuc-*) ;;
            *) echo "unexpected promotion branch: $HEAD_REF" >&2; exit 1 ;;
          esac

      - name: Checkout promotion candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure Node.js (from trusted control tree)
        uses: ./control/.github/actions/ensure-node

      - name: Report Dell identity and capacity
        run: |
          set -euo pipefail
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'host=%s\n' "$(hostname)"
          printf 'node=%s\n' "$(node --version)"
          df -h /
          test "${RUNNER_NAME:-}" = "automation-dell-financial-analysis"

      - name: Install exact candidate dependencies
        working-directory: source
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.17.0 --activate
          printf 'pnpm=%s\n' "$(pnpm --version)"
          pnpm install --frozen-lockfile
          pnpm run check:runtime

      - name: Run authoritative candidate verification
        working-directory: source
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m pnpm run test:ci
