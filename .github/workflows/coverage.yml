name: Coverage

on:
  push:
    branches: [main]
    paths:
      - 'packages/analysis/**'
      - 'packages/ui/**'
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/coverage.yml'
      - '.github/actions/**'
  schedule:
    # Weekly coverage report (Mon 06:00 UTC)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Run analysis coverage
        run: pnpm --filter @financial-analysis/analysis run test:coverage:ci

      - name: Detect Codecov token
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage (Codecov)
        if: steps.codecov.outputs.enabled == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: packages/analysis/coverage/coverage-final.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov skipped (no token)
        if: steps.codecov.outputs.enabled != 'true'
        run: echo "CODECOV_TOKEN not configured — coverage artifacts uploaded only."

      - name: Upload analysis coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: analysis-coverage
          path: packages/analysis/coverage
          retention-days: 7

  web-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Run web coverage
        run: pnpm --filter @financial-analysis/web run test:coverage

      - name: Detect Codecov token
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload web coverage (Codecov)
        if: steps.codecov.outputs.enabled == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: apps/web/coverage/vitest/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov skipped (no token)
        if: steps.codecov.outputs.enabled != 'true'
        run: echo "CODECOV_TOKEN not configured — coverage artifacts uploaded only."

      - name: Upload web coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-coverage
          path: apps/web/coverage/vitest
          retention-days: 7
