name: Coverage

on:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run analysis coverage
        run: pnpm --filter @financial-analysis/analysis run test:coverage

      - name: Upload coverage (Codecov)
        uses: codecov/codecov-action@v6
        with:
          files: packages/analysis/coverage/coverage-final.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload analysis coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-coverage
          path: packages/analysis/coverage
          retention-days: 7

  web-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web coverage
        run: pnpm --filter @financial-analysis/web run test:coverage

      - name: Upload web coverage (Codecov)
        uses: codecov/codecov-action@v6
        with:
          files: apps/web/coverage/vitest/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload web coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/vitest
          retention-days: 7
