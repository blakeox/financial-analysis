name: Coverage

on:
  push:
    branches: [main]
    paths:
      - 'packages/analysis/**'
      - 'packages/ui/**'
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/coverage.yml'
      - '.github/actions/**'
  schedule:
    # Weekly coverage report (Mon 06:00 UTC)
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Run analysis coverage
        run: pnpm --filter @financial-analysis/analysis run test:coverage

      - name: Upload coverage (Codecov)
        uses: codecov/codecov-action@v6
        with:
          files: packages/analysis/coverage/coverage-final.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload analysis coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-coverage
          path: packages/analysis/coverage
          retention-days: 7

  web-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Run web coverage
        run: pnpm --filter @financial-analysis/web run test:coverage

      - name: Upload web coverage (Codecov)
        uses: codecov/codecov-action@v6
        with:
          files: apps/web/coverage/vitest/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload web coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web/coverage/vitest
          retention-days: 7
