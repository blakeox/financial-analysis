name: Sync GitHub labels

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync labels from .github/labels.yml
        uses: micnncim/action-label-sync@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prune: false
