name: Pull Request Checks

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    outputs:
      skip_ci: ${{ steps.skip.outputs.skip_ci }}
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect skip-ci label
        id: skip
        uses: ./.github/actions/pr-skip-ci
        with:
          pr_labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      - name: Detect non-doc code changes
        id: filter
        uses: ./.github/actions/repo-path-filter
        with:
          filters: .github/path-filters.yml

  duplicate-check:
    name: Duplicate file check
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Skipped (skip-ci or docs-only)
        if: needs.gate.outputs.skip_ci == 'true' || needs.gate.outputs.code_changed != 'true'
        run: echo "Duplicate check skipped."

      - name: Checkout
        if: needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check for duplicate files
        if: needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: node scripts/check-repo-duplicates.mjs --files-only

  dependency-review:
    name: Dependency review
    needs: gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Skipped (skip-ci or docs-only)
        if: needs.gate.outputs.skip_ci == 'true' || needs.gate.outputs.code_changed != 'true'
        run: echo "Dependency review skipped."

      - name: Checkout
        if: needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dependency review
        if: needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  secret-scan:
    name: Secret scan
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Skipped (skip-ci label)
        if: needs.gate.outputs.skip_ci == 'true'
        run: echo "Secret scan skipped via skip-ci label."

      - name: Checkout
        if: needs.gate.outputs.skip_ci != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        if: needs.gate.outputs.skip_ci != 'true'
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --only-verified
