name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/chatmodes/**'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI gate
    if: >-
      github.event_name == 'pull_request' ||
      (github.actor == 'blakeox' || github.actor == 'github-actions[bot]')
    runs-on: [self-hosted, nuc, financial-analysis]
    outputs:
      nuc_run: ${{ steps.policy.outputs.run }}
      policy_message: ${{ steps.policy.outputs.policy_message }}
      skip_ci: ${{ steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci || steps.policy.outputs.skip_ci }}
      code_changed: ${{ steps.policy.outputs.run == 'true' && steps.code.outputs.code || steps.policy.outputs.code_changed }}
      run_e2e: ${{ steps.policy.outputs.run == 'true' && steps.e2e.outputs.run_e2e || steps.policy.outputs.run_e2e }}
    steps:
      - name: Resolve NUC execution policy
        id: policy
        shell: bash
        env:
          NUC_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/scripts/ci/nuc-execution-policy.sh?ref=${{ github.sha }}" \
            | jq -r .content | base64 -d > /tmp/nuc-execution-policy.sh
          bash /tmp/nuc-execution-policy.sh

      - name: Report NUC policy (no checkout)
        if: steps.policy.outputs.run != 'true'
        run: echo "${{ steps.policy.outputs.policy_message }}"

      - name: Checkout
        if: steps.policy.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Materialize full working tree (persistent NUC workspace)
        if: steps.policy.outputs.run == 'true'
        shell: bash
        run: |
          git sparse-checkout disable 2>/dev/null || true
          git checkout-index -a -f
          test -f .github/actions/pr-skip-ci/action.yml

      - name: Detect skip-ci label
        if: steps.policy.outputs.run == 'true'
        id: skip
        uses: ./.github/actions/pr-skip-ci
        with:
          pr_labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      - name: Detect path changes
        if: steps.policy.outputs.run == 'true'
        id: paths
        uses: ./.github/actions/repo-path-filter
        with:
          filters-file: .github/path-filters.yml

      - name: Decide code changed
        if: steps.policy.outputs.run == 'true'
        id: code
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ steps.paths.outputs.code }}" == "true" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide Playwright smoke
        if: steps.policy.outputs.run == 'true'
        id: e2e
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ steps.paths.outputs.web }}" == "true" ]]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build and test
    needs: gate
    if: >-
      always() && needs.gate.result == 'success' && (
        github.event_name == 'pull_request' ||
        (github.actor == 'blakeox' || github.actor == 'github-actions[bot]')
      )
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 45
    steps:
      - name: NUC policy (no code execution)
        if: needs.gate.outputs.nuc_run != 'true'
        run: echo "${{ needs.gate.outputs.policy_message }}"

      - name: CI skipped (skip-ci label)
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci == 'true'
        run: |
          echo "CI skipped via skip-ci label. Remove the label or push new commits to run checks."

      - name: Doc-only change (no code paths)
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed != 'true'
        run: echo "Doc-only PR — skipping install, typecheck, lint, audit, and tests."

      - name: Checkout
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup monorepo
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        uses: ./.github/actions/setup-monorepo

      - name: Check for duplicate files
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true' && github.event_name != 'pull_request'
        run: pnpm run check:duplicates

      - name: Check provider-utils override
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: pnpm run check:provider-utils-override

      - name: Run API smoke tests
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: pnpm test:smoke

      - name: Typecheck
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: pnpm run typecheck

      - name: Check generated Worker types
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: pnpm run check:worker-types

      - name: Lint
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: pnpm lint

      - name: Format check
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: pnpm run format:check

      - name: Security audit
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: pnpm audit --audit-level moderate

      - name: Run unit tests
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true'
        run: pnpm test

      - name: Build web for Playwright smoke
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true' && needs.gate.outputs.run_e2e == 'true'
        run: pnpm run build:libs && pnpm -C apps/web run build

      - name: Start dev stack for Playwright
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true' && needs.gate.outputs.run_e2e == 'true'
        run: bash scripts/ci/start-dev-stack-for-playwright.sh

      - name: Run Playwright smoke tests
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true' && needs.gate.outputs.run_e2e == 'true'
        run: bash scripts/ci/playwright-docker-smoke.sh

      - name: Stop dev stack for Playwright
        if: always() && needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true' && needs.gate.outputs.run_e2e == 'true'
        run: bash scripts/ci/stop-dev-stack-for-playwright.sh

      - name: Playwright skipped (workers-only / no web paths)
        if: needs.gate.outputs.nuc_run == 'true' && needs.gate.outputs.skip_ci != 'true' && needs.gate.outputs.code_changed == 'true' && needs.gate.outputs.run_e2e != 'true'
        run: echo "Skipping Playwright — no web-related paths changed (see .github/workflows/README.md)."

  build-artifacts:
    name: Build artifacts
    needs: build-and-test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.build-and-test.result == 'success' &&
      (github.actor == 'blakeox' || github.actor == 'github-actions[bot]')
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build all packages
        run: |
          pnpm -C apps/web run build
          pnpm --filter @financial-analysis/web-worker run build
          pnpm --filter @financial-analysis/api run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          path: |
            apps/web/dist/
            workers/api/dist/
            packages/*/dist/
          retention-days: 30
