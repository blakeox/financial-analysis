name: CI Pipeline

on:
  # Full pipeline on main push; security job also runs on PRs for CodeQL config parity.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Default, least-privilege permissions for all jobs; override per-job when needed
permissions:
  contents: read
  actions: read

# Avoid duplicate runs on the same ref
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality Checks
  quality:
    name: Code Quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Check for duplicate files
        run: pnpm run check:duplicates

      - name: TypeScript type checking
        run: pnpm run typecheck

      - name: Lint code
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  # Workspace Tests
  test:
    name: Workspace Tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Run workspace tests
        run: pnpm run test

  # Build
  build:
    name: Build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build all packages
        run: |
          # UI already built via build:libs; build Astro site next
          # Build Astro web app to produce apps/web/dist for the web worker assets
          pnpm -C apps/web run build
          # Build Workers (web dry-run and API typecheck build)
          pnpm --filter @financial-analysis/web-worker run build
          pnpm --filter @financial-analysis/api run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/dist/
            workers/api/dist/
            packages/*/dist/
          retention-days: 30

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    if: >-
      github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.quality.result == 'success')
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Run security audit
        run: pnpm audit --audit-level moderate
