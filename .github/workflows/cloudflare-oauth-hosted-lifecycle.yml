name: Cloudflare OAuth Hosted Lifecycle

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: Confirm that this run may create and revoke an isolated preview grant
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-oauth-hosted-lifecycle-preview
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Hosted OAuth lifecycle (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      API_URL: https://fanalyx-api-preview.blakeoxford.workers.dev
      ENVIRONMENT: preview
      CLOUDFLARE_OAUTH_HOSTED_RECEIPT: cloudflare-oauth-hosted-lifecycle.json
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Require explicit mutation confirmation
        if: inputs.confirm_preview != true
        run: |
          echo 'Set confirm_preview=true to create and revoke an isolated preview grant.' >&2
          exit 1

      - name: Verify protected session secret
        env:
          FANALYX_OIDC_SESSION_COOKIE: ${{ secrets.FANALYX_OIDC_SESSION_COOKIE }}
        run: |
          set -euo pipefail
          [[ "$FANALYX_OIDC_SESSION_COOKIE" =~ ^__Host-FANALYX_OIDC_SESSION=[A-Za-z0-9_-]{32,128}$ ]] || {
            echo 'FANALYX_OIDC_SESSION_COOKIE must be a current, browser-created session cookie.' >&2
            exit 1
          }

      - name: Run protected hosted lifecycle
        env:
          FANALYX_OIDC_SESSION_COOKIE: ${{ secrets.FANALYX_OIDC_SESSION_COOKIE }}
        run: node scripts/cloudflare-oauth-hosted-lifecycle.mjs

      - name: Validate redacted receipt
        run: |
          set -euo pipefail
          jq -e \
            '.schemaVersion == "1.0.0" and
             .kind == "cloudflare-oauth-hosted-lifecycle" and
             .environment == "preview" and
             .mutatesOAuthState == true and
             .passed == true and
             .cleanup.grantRevoked == true and
             (.checks | length >= 13)' \
            cloudflare-oauth-hosted-lifecycle.json >/dev/null
          if grep -Eqi 'access_token|refresh_token|authorization_code|__Host-FANALYX_OIDC_SESSION|code=[A-Za-z0-9._~-]{12,}|token=[A-Za-z0-9._~-]{12,}' cloudflare-oauth-hosted-lifecycle.json; then
            echo 'Hosted OAuth receipt contains credential-like material.' >&2
            exit 1
          fi

      - name: Publish lifecycle summary
        if: always()
        run: |
          {
            echo '## Hosted OAuth lifecycle'
            echo
            echo '- Environment: `preview`'
            echo '- The run used a protected, browser-created resource-owner session.'
            echo '- The receipt is redacted; no cookies, codes, access tokens, refresh tokens, or callback values are emitted.'
            echo '- The isolated grant is revoked before the run can pass.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted lifecycle receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-oauth-hosted-lifecycle-preview
          path: cloudflare-oauth-hosted-lifecycle.json
          if-no-files-found: ignore
          retention-days: 7
