name: E2E Web

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which web lane to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - smoke-matrix
          - full
          - flake
      flake_target:
        description: Playwright file or directory under tests/ for flake repro
        required: false
        default: tests/site/smoke-test.spec.ts
        type: string
      repeat_each:
        description: Repeat count for flake repro
        required: false
        default: '3'
        type: string
      project:
        description: Browser project for flake repro
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - mobile-safari

permissions:
  contents: read

concurrency:
  group: e2e-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: apps/web
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Run web smoke lane
        working-directory: apps/web
        run: pnpm run test:ci:smoke

      - name: Upload smoke Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
          retention-days: 7

  smoke-matrix:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'smoke-matrix')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: apps/web
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Run web smoke matrix lane
        working-directory: apps/web
        run: pnpm run test:ci:smoke:matrix

      - name: Upload smoke matrix Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-matrix-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
          retention-days: 7

  full-matrix:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-safari]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: apps/web
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Run web full preflight
        working-directory: apps/web
        run: pnpm run test:layout && pnpm run typecheck:tests

      - name: Run Playwright matrix project
        working-directory: apps/web
        run: PLAYWRIGHT_MATRIX=1 pnpm exec playwright test --project "${{ matrix.project }}"

      - name: Upload full matrix Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
          retention-days: 7

  flake-repro:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'flake'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: apps/web
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run flake repro lane
        working-directory: apps/web
        run: pnpm exec node scripts/test-runner.mjs --playwright "${{ github.event.inputs.flake_target }}" --project "${{ github.event.inputs.project }}" --repeat-each "${{ github.event.inputs.repeat_each }}" --json-summary test-results/runner/flake-repro-summary.json

      - name: Upload flake repro Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-flake-repro
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
            apps/web/test-results/runner
          retention-days: 7
