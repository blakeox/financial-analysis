name: E2E Web

on:
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly extended web smoke (Mon 12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Which web lane to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - smoke-matrix
          - full
          - flake
      flake_target:
        description: Playwright file or directory under tests/ for flake repro
        required: false
        default: tests/site/smoke-test.spec.ts
        type: string
      repeat_each:
        description: Repeat count for flake repro
        required: false
        default: '3'
        type: string
      project:
        description: Browser project for flake repro
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - mobile-safari

permissions:
  contents: read

concurrency:
  group: e2e-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: E2E smoke
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 30
    steps:
      - name: Checkout NUC policy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: scripts/ci/nuc-execution-policy.sh
          sparse-checkout-cone-mode: false

      - name: Resolve NUC execution policy
        id: policy
        shell: bash
        env:
          NUC_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash scripts/ci/nuc-execution-policy.sh

      - name: Report NUC policy (no checkout)
        if: steps.policy.outputs.run != 'true'
        run: echo "${{ steps.policy.outputs.policy_message }}"

      - name: Checkout
        if: steps.policy.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          sparse-checkout: ''
          sparse-checkout-cone-mode: false

      - name: Detect skip-ci label
        if: steps.policy.outputs.run == 'true'
        id: skip
        uses: ./.github/actions/pr-skip-ci
        with:
          pr_labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      - name: Detect path changes
        if: steps.policy.outputs.run == 'true'
        id: paths
        uses: ./.github/actions/repo-path-filter
        with:
          filters-file: .github/path-filters.yml

      - name: Skipped (skip-ci label)
        if: steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci == 'true'
        run: echo "E2E skipped via skip-ci label."

      - name: Skipped (no web-related paths)
        if: steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web != 'true'
        run: echo "E2E skipped — no web-related paths changed."

      - name: Setup monorepo
        if: steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web == 'true'
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        if: steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web == 'true'
        run: pnpm run build:libs

      - name: Build web
        if: steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web == 'true'
        working-directory: apps/web
        run: pnpm build

      - name: Run web CI preflight (non-browser)
        if: steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web == 'true'
        working-directory: apps/web
        run: pnpm run test:layout && pnpm run typecheck:tests && pnpm run test:unit && pnpm run test:ui:status

      - name: Start dev stack for Playwright
        if: steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web == 'true'
        run: bash scripts/ci/start-dev-stack-for-playwright.sh

      - name: Run web smoke matrix lane
        if: steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web == 'true'
        run: bash scripts/ci/playwright-docker-smoke.sh matrix

      - name: Stop dev stack for Playwright
        if: always() && steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web == 'true'
        run: bash scripts/ci/stop-dev-stack-for-playwright.sh

      - name: Upload smoke matrix Playwright artifacts
        if: always() && steps.policy.outputs.run == 'true' && steps.skip.outputs.skip_ci != 'true' && steps.paths.outputs.web == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-smoke-matrix-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
          retention-days: 7

  smoke:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'smoke')
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Run web CI preflight (non-browser)
        working-directory: apps/web
        run: pnpm run test:layout && pnpm run typecheck:tests && pnpm run test:unit && pnpm run test:ui:status

      - name: Start dev stack for Playwright
        run: bash scripts/ci/start-dev-stack-for-playwright.sh

      - name: Run web smoke lane
        run: bash scripts/ci/playwright-docker-smoke.sh

      - name: Stop dev stack for Playwright
        if: always()
        run: bash scripts/ci/stop-dev-stack-for-playwright.sh

      - name: Upload smoke Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-smoke-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
          retention-days: 7

  smoke-matrix:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'smoke-matrix'
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Run web CI preflight (non-browser)
        working-directory: apps/web
        run: pnpm run test:layout && pnpm run typecheck:tests && pnpm run test:unit && pnpm run test:ui:status

      - name: Start dev stack for Playwright
        run: bash scripts/ci/start-dev-stack-for-playwright.sh

      - name: Run web smoke matrix lane
        run: bash scripts/ci/playwright-docker-smoke.sh matrix

      - name: Stop dev stack for Playwright
        if: always()
        run: bash scripts/ci/stop-dev-stack-for-playwright.sh

      - name: Upload smoke matrix Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-smoke-matrix-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
          retention-days: 7

  full-matrix:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-safari]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Run web full preflight
        working-directory: apps/web
        run: pnpm run test:layout && pnpm run typecheck:tests

      - name: Start dev stack for Playwright
        run: bash scripts/ci/start-dev-stack-for-playwright.sh

      - name: Run Playwright matrix project
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_USE_HOST_NETWORK: '1'
        run: >-
          bash scripts/ci/run-in-playwright-container.sh apps/web
          'PLAYWRIGHT_MATRIX=1 playwright test --project "${{ matrix.project }}"'

      - name: Stop dev stack for Playwright
        if: always()
        run: bash scripts/ci/stop-dev-stack-for-playwright.sh

      - name: Upload full matrix Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-full-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
          retention-days: 7

  flake-repro:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'flake'
    runs-on: [self-hosted, nuc, financial-analysis]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Start dev stack for Playwright
        run: bash scripts/ci/start-dev-stack-for-playwright.sh

      - name: Run flake repro lane
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_USE_HOST_NETWORK: '1'
        run: >-
          bash scripts/ci/run-in-playwright-container.sh apps/web
          'node scripts/test-runner.mjs --playwright "${{ github.event.inputs.flake_target }}"
          --project "${{ github.event.inputs.project }}" --repeat-each "${{ github.event.inputs.repeat_each }}"
          --json-summary test-results/runner/flake-repro-summary.json'

      - name: Stop dev stack for Playwright
        if: always()
        run: bash scripts/ci/stop-dev-stack-for-playwright.sh

      - name: Upload flake repro Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-flake-repro
          path: |
            apps/web/playwright-report
            apps/web/test-results/playwright
            apps/web/test-results/runner
          retention-days: 7
