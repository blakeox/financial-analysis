name: Mutation Tests (Analysis)

on:
  schedule:
    # Monthly mutation testing (1st of month, 08:00 UTC)
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build shared packages
        run: pnpm run build:libs

      - name: Run mutation tests (analysis)
        run: pnpm --filter @financial-analysis/analysis test:mutation
