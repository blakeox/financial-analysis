name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Version and changelog (Changesets)
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Check for pending changesets
        id: pending
        shell: bash
        run: |
          found=false
          for f in .changeset/*.md; do
            [[ -f "$f" ]] || continue
            [[ "$(basename "$f")" == "README.md" ]] && continue
            found=true
            break
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Create Release PR with Changesets
        if: steps.pending.outputs.found == 'true'
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v1
        with:
          version: pnpm -w changeset version
          # Monorepo is not published to npm; version PR only.
          publish: echo "Skipping npm publish — packages are consumed in-repo."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No pending changesets
        if: steps.pending.outputs.found != 'true'
        run: echo "No changesets to version — skipping release job."
