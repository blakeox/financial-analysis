name: Cloudflare WAF Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-waf-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Read WAF entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify WAF read credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_READ_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo 'CLOUDFLARE_WAF_READ_TOKEN is required.' >&2
            exit 1
          }
          test -n "${CLOUDFLARE_ZONE_ID:-}" || {
            echo 'CLOUDFLARE_ZONE_ID is required.' >&2
            exit 1
          }
          token_status=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          jq -e '.success == true and .result.status == "active"' <<<"${token_status}" >/dev/null || {
            echo 'CLOUDFLARE_WAF_READ_TOKEN is not active.' >&2
            exit 1
          }

      - name: Run read-only WAF audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_READ_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node scripts/cloudflare-waf-audit.mjs > waf-audit.json

      - name: Validate WAF audit receipt
        run: |
          set -euo pipefail
          jq -e \
            '.schemaVersion == "1.0.0" and
             .kind == "cloudflare-waf-audit" and
             .readOnly == true and
             .passed == true and
             (.checks | length == 3)' \
            waf-audit.json >/dev/null

      - name: Upload WAF audit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-waf-audit
          path: waf-audit.json
          if-no-files-found: ignore
