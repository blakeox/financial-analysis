name: Cloudflare WAF Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-waf-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Read WAF entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run read-only WAF audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_READ_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node scripts/cloudflare-waf-audit.mjs
